# Scans every push and pull request for accidentally committed secrets.
# This is your first CI pipeline. Later (CI/CD modules), pin these actions to
# full commit SHAs instead of version tags, which is the safer practice.
name: Secret scan

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
